# Nginx 설정 - 기후동행카드 조회 시스템
# HTTP -> HTTPS 리다이렉트 (Punycode 사용)
server {
    listen 80;
    server_name xn--ok0bj1ih96a79a.site www.xn--ok0bj1ih96a79a.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xn--ok0bj1ih96a79a.site$request_uri;
    }
}

# www -> non-www 리디렉션 (SEO 중복 페이지 문제 해결)
server {
    listen 443 ssl;
    server_name www.xn--ok0bj1ih96a79a.site;

    ssl_certificate /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/privkey.pem;

    return 301 https://xn--ok0bj1ih96a79a.site$request_uri;
}

# HTTPS 서버 (메인)
server {
    listen 443 ssl default_server;
    server_name xn--ok0bj1ih96a79a.site;

    # SSL 인증서 경로 (Certbot)
    ssl_certificate /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/privkey.pem;

    # 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 보안 헤더
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://dapi.kakao.com https://t1.daumcdn.net https://*.sentry.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self' https://dapi.kakao.com https://*.sentry.io; frame-src 'self';" always;

    # 프론트엔드 (React 빌드 파일)
    root /usr/share/nginx/html;
    index index.html;

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator
    location /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # 정적 파일 캐싱
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # React Router 지원
    location / {
        try_files $uri $uri/ /index.html;
    }
}
