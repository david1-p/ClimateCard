# Nginx 설정 - 기후동행카드 조회 시스템
# HTTP -> HTTPS 리다이렉트
# Nginx 설정 - 기후동행카드 조회 시스템
# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name 기후동행.site www.기후동행.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl;
    server_name 기후동행.site www.기후동행.site;

    # SSL 인증서 경로 (Certbot)
    ssl_certificate /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--ok0bj1ih96a79a.site/privkey.pem;

    # 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 프론트엔드 (React 빌드 파일)
    root /usr/share/nginx/html;
    index index.html;

    # API Reverse Proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator
    location /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # 정적 파일 캐싱
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # React Router 지원
    location / {
        try_files $uri $uri/ /index.html;
    }
}
