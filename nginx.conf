# Nginx 설정 - 기후동행카드 조회 시스템
# HTTPS + 보안 헤더 + Reverse Proxy

# HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name 기후동행.site www.기후동행.site;

    # Let's Encrypt ACME Challenge (인증서 발급용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 기후동행.site www.기후동행.site;

    # SSL 인증서 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/기후동행.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/기후동행.site/privkey.pem;

    # SSL 설정 (현대적이고 안전한 설정)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL 세션 캐시 (성능 향상)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling (SSL 인증서 검증 성능 향상)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/기후동행.site/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://dapi.kakao.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://dapi.kakao.com;" always;

    # gzip 압축 (성능 향상)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # 프론트엔드 (React 빌드 파일)
    root /usr/share/nginx/html;
    index index.html;

    # React Router (SPA) 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Reverse Proxy (백엔드로 전달)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Actuator (헬스체크)
    location /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        access_log off;  # 헬스체크 로그는 기록 안 함
    }

    # 정적 파일 캐싱 (성능 향상)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 로그 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
