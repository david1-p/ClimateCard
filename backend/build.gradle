plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.owasp.dependencycheck' version '9.0.9'
	id 'org.sonarqube' version '5.1.0.4882'
	id 'jacoco'
}

group = 'com.climate'
version = '0.0.1-SNAPSHOT'
description = 'Climate Transport Card Route Lookup System'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// PostGIS (위치 기반 쿼리)
	implementation 'org.hibernate.orm:hibernate-spatial:6.4.4.Final'
	implementation 'net.postgis:postgis-jdbc:2023.1.0'

	// Flyway (DB 마이그레이션)
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Rate Limiting
	implementation 'com.google.guava:guava:32.1.3-jre'

	// Excel 파싱
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// JSON 처리
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // XML Parsing (공공데이터)
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
}

tasks.named('test') {
	useJUnitPlatform()
}

// OWASP Dependency Check 설정
dependencyCheck {
	formats = ['HTML', 'JSON']
	failBuildOnCVSS = 7  // CVSS 점수 7 이상 (High, Critical)이면 빌드 실패
	analyzers {
		assemblyEnabled = false  // .NET 분석 비활성화 (성능 향상)
	}
}

// JaCoCo 코드 커버리지 설정
jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

test {
	finalizedBy jacocoTestReport
}

// SonarQube 설정
sonar {
	properties {
		property "sonar.projectKey", "climate-transport-card"
		property "sonar.projectName", "기후동행카드 조회 시스템"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.sources", "src/main/java"
		property "sonar.tests", "src/test/java"
		property "sonar.java.binaries", "build/classes/java/main"
		property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.java.source", "21"
		property "sonar.sourceEncoding", "UTF-8"

		// 코드 스멜 임계값 설정
		property "sonar.qualitygate.wait", "false"

		// 제외할 패턴
		property "sonar.exclusions", "**/config/**,**/dto/**,**/entity/**"
		property "sonar.test.exclusions", "**/test/**"
	}
}
