spring:
  application:
    name: climate-transport-card

  profiles:
    active: ${PROFILE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:climate_transport_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
        use_sql_comments: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 기본 TTL 1시간 (밀리초)
      cache-null-values: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 공공 API 설정
public-api:
  service-key: ${PUBLIC_API_SERVICE_KEY}
  base-url: http://ws.bus.go.kr/api/rest
  connect-timeout: 5000
  read-timeout: 10000
  max-retries: 3
  retry-delay: 1000

# 서울열린데이터광장 API 설정
seoul-api:
  service-key: ${SEOUL_API_KEY}
  base-url: http://openapi.seoul.go.kr:8088
  connect-timeout: 5000
  read-timeout: 10000
  
# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when-authorized
    caches:
      enabled: true

# Server 설정
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 10000
    accept-count: 100

# Admin API 설정
admin:
  api:
    key: ${ADMIN_API_KEY}  # 필수 환경변수 (기본값 없음, 보안 강화)

# Logging (기본 설정 - 프로필별 오버라이드)
logging:
  level:
    com.climate.transport: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true  # 개발 환경에서만 SQL 로그 출력

# 개발 환경 로깅 (상세 로그)
logging:
  level:
    com.climate.transport: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# 프로덕션 환경 설정
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false  # 프로덕션에서는 SQL 로그 비활성화

# 프로덕션 로깅 (경고 및 에러만)
logging:
  level:
    com.climate.transport: INFO
    org.hibernate.SQL: WARN
