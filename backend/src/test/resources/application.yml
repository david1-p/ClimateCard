# 테스트용 Spring Boot 설정

spring:
  # PostgreSQL 사용 (로컬 도커 컨테이너)
  datasource:
    url: jdbc:postgresql://localhost:5432/climate_transport
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1q2w

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: validate  # 테스트에서도 실제 스키마 사용
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
        format_sql: true
    show-sql: false

  # Redis (임베디드 사용)
  data:
    redis:
      host: localhost
      port: 6379

  # Flyway 비활성화 (테스트에서는 ddl-auto로 스키마 생성)
  flyway:
    enabled: false

# 외부 API 설정 (더미 값)
public-api:
  service-key: test-key
  base-url: http://localhost:8080

seoul-api:
  service-key: test-key
  base-url: http://localhost:8080

# 관리자 API 키 (테스트용)
admin:
  api:
    key: test-admin-key

# Sentry 비활성화
sentry:
  dsn: ""
  enabled: false

# 로깅
logging:
  level:
    root: INFO
    com.climate.transport: DEBUG
