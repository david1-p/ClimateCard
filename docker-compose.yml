name: climate-transport-card

services:
  # PostgreSQL + PostGIS (dev, prod에서만 사용)
  postgres:
    image: postgis/postgis:15-3.3
    container_name: climate-postgres
    profiles: ["dev", "prod"]
    environment:
      POSTGRES_DB: ${DB_NAME:-climate_transport}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      -c max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      -c work_mem=${POSTGRES_WORK_MEM:-4MB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-climate_transport}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (모든 환경에서 사용)
  redis:
    image: redis:7-alpine
    container_name: climate-redis
    profiles: ["dev", "prod", "neon"]
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY_LIMIT:-256M}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Spring Boot Backend (prod, neon에서만 사용)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climate-transport-backend
    profiles: ["prod", "neon"]
    environment:
      # Database
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-climate_transport}}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

      # API Keys
      PUBLIC_API_SERVICE_KEY: ${PUBLIC_API_SERVICE_KEY}
      SEOUL_API_KEY: ${SEOUL_API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN}

      # Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}

      # Timezone
      TZ: Asia/Seoul
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-512M}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # Nginx (prod, neon에서만 사용)
  nginx:
    image: nginx:alpine
    container_name: climate-transport-nginx
    profiles: ["prod", "neon"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 64M

  # Certbot (prod, neon에서만 사용)
  certbot:
    image: certbot/certbot
    container_name: climate-transport-certbot
    profiles: ["prod", "neon"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - app-network

  # SonarQube (dev 환경에서만 사용 - 코드 품질 분석)
  sonarqube:
    image: sonarqube:25.12.0.117093-community
    container_name: climate-sonarqube
    profiles: ["dev"]
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2G

  # Locust (부하 테스트 - 필요 시 수동 실행)
  locust:
    image: locustio/locust:latest
    container_name: climate-locust
    profiles: ["loadtest"]
    ports:
      - "8089:8089"
    volumes:
      - ./loadtest:/mnt/locust
    command: -f /mnt/locust/locustfile.py --host=http://backend:8080
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  app-network:
    driver: bridge
